<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>悬浮时间笔 · 动效概念</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #11100f;
      --brass: #b88a43;
      --brass-light: #e0bd76;
      --walnut: #40291d;
      --sand: #d8aa54;
      --screen: #181c1b;
      --screen-text: #c9d8cc;
      --muted: #938b82;
      --panel: rgba(17, 16, 15, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #171717;
      color: #f3eee7;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      isolation: isolate;
      background:
        linear-gradient(180deg, #252321 0%, #151515 62%, #26201b 62%, #35261e 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 124px;
      height: 38%;
      z-index: -1;
      background:
        repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 2px, transparent 2px 61px),
        linear-gradient(90deg, #2b1b15, #533529 48%, #291a15);
      box-shadow: inset 0 20px 50px rgba(0,0,0,.34);
    }

    .topline {
      position: absolute;
      top: 28px;
      left: 32px;
      right: 32px;
      z-index: 8;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .title {
      max-width: 460px;
    }

    .title h1 {
      margin: 0 0 8px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 25px;
      font-weight: 500;
    }

    .title p,
    .mode-note {
      margin: 0;
      color: #aaa29a;
      font-size: 13px;
      line-height: 1.55;
    }

    .mode-note {
      text-align: right;
      max-width: 240px;
    }

    .scene {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 620px;
      padding: 80px 24px 20px;
      perspective: 1200px;
    }

    .product {
      position: relative;
      width: min(720px, 92vw);
      height: 460px;
      transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
    }

    .product.guest-view { transform: rotateY(180deg); }

    .pen-rig {
      position: absolute;
      left: 50%;
      top: 58px;
      width: 390px;
      height: 88px;
      margin-left: -195px;
      transform: translateZ(90px) rotateZ(-10deg);
      transform-style: preserve-3d;
      animation: floatPen 4s ease-in-out infinite;
      z-index: 5;
    }

    .pen {
      position: absolute;
      left: 28px;
      top: 22px;
      width: 330px;
      height: 34px;
      border-radius: 18px 7px 7px 18px;
      background:
        linear-gradient(180deg, #6e4d24 0%, #dfbd76 20%, #a87735 48%, #4f361d 74%, #c7954a 100%);
      box-shadow:
        0 13px 28px rgba(0,0,0,.52),
        inset 0 2px 2px rgba(255,255,255,.35),
        inset 0 -4px 8px rgba(26,12,3,.52);
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .pen::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 72px;
      width: 2px;
      background: rgba(45,27,11,.55);
      box-shadow: 202px 0 rgba(45,27,11,.42);
    }

    .pen::after {
      content: "";
      position: absolute;
      left: -40%;
      top: 0;
      width: 34%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
      transform: skewX(-18deg);
      animation: penHighlight 6s ease-in-out infinite;
    }

    .nib {
      position: absolute;
      right: 3px;
      top: 31px;
      width: 32px;
      height: 16px;
      background: #8d692e;
      clip-path: polygon(0 8%, 100% 50%, 0 92%);
      filter: drop-shadow(4px 3px 3px rgba(0,0,0,.35));
    }

    .clip {
      position: absolute;
      left: 73px;
      top: 10px;
      width: 92px;
      height: 7px;
      border-radius: 8px;
      border: 2px solid #d6b16c;
      border-left-color: transparent;
      box-shadow: 0 3px 4px rgba(0,0,0,.35);
    }

    .spin-on .pen {
      animation: spinBody 6s linear infinite;
    }

    .timer-on .pen-rig { animation-duration: 7s; }
    .timer-on.spin-on .pen { animation-duration: 18s; }

    .magnetic-shadow {
      position: absolute;
      left: 50%;
      top: 180px;
      width: 300px;
      height: 28px;
      margin-left: -150px;
      border-radius: 50%;
      background: rgba(0,0,0,.5);
      filter: blur(13px);
      animation: shadowPulse 4s ease-in-out infinite;
    }

    .base {
      position: absolute;
      left: 50%;
      top: 210px;
      width: 500px;
      height: 190px;
      margin-left: -250px;
      border-radius: 7px 7px 14px 14px;
      transform-style: preserve-3d;
      background:
        linear-gradient(180deg, #5b3b29 0%, #2e1d16 11%, #171514 13%, #292521 100%);
      box-shadow:
        0 44px 58px rgba(0,0,0,.52),
        inset 0 2px 0 rgba(238,197,132,.23),
        inset 0 -12px 22px rgba(0,0,0,.4);
    }

    .base::before {
      content: "";
      position: absolute;
      left: 26px;
      right: 26px;
      top: 19px;
      height: 20px;
      border-radius: 50%;
      background: #171412;
      box-shadow: inset 0 5px 9px rgba(0,0,0,.8), 0 1px rgba(228,184,112,.12);
    }

    .face {
      position: absolute;
      left: 50%;
      top: 62px;
      width: 328px;
      height: 92px;
      margin-left: -164px;
      border: 1px solid #745c37;
      border-radius: 5px;
      overflow: hidden;
      background: var(--screen);
      box-shadow:
        inset 0 0 22px rgba(0,0,0,.9),
        0 5px 13px rgba(0,0,0,.38);
      backface-visibility: hidden;
    }

    .guest-face {
      transform: rotateY(180deg) translateZ(1px);
    }

    .screen-content {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 78px;
      align-items: center;
      padding: 13px 20px 12px 24px;
      color: var(--screen-text);
    }

    .guest-face .screen-content {
      grid-template-columns: 1fr;
      place-items: center;
      padding: 0;
    }

    .clock,
    .countdown {
      font-family: "Segoe UI", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 42px;
      font-weight: 300;
      line-height: 1;
      text-shadow: 0 0 14px rgba(172,215,188,.18);
    }

    .countdown { display: none; }
    .timer-on .owner-face .clock { display: none; }
    .timer-on .owner-face .countdown { display: block; }

    .hourglass {
      position: relative;
      width: 38px;
      height: 60px;
      margin-left: auto;
      opacity: .68;
      filter: drop-shadow(0 0 8px rgba(216,170,84,.18));
    }

    .hourglass::before,
    .hourglass::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      height: 4px;
      border-radius: 4px;
      background: #88704d;
    }

    .hourglass::before { top: 1px; }
    .hourglass::after { bottom: 1px; }

    .glass-top,
    .glass-bottom {
      position: absolute;
      left: 7px;
      width: 24px;
      height: 25px;
      border: 1px solid rgba(186,199,189,.48);
      overflow: hidden;
    }

    .glass-top {
      top: 6px;
      clip-path: polygon(0 0, 100% 0, 56% 100%, 44% 100%);
    }

    .glass-bottom {
      bottom: 6px;
      clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
    }

    .sand-top,
    .sand-bottom {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--sand);
    }

    .sand-top {
      top: 0;
      height: 92%;
      animation: idleTop 6s linear infinite;
    }

    .sand-bottom {
      bottom: 0;
      height: 8%;
      animation: idleBottom 6s linear infinite;
    }

    .sand-stream {
      position: absolute;
      left: 18px;
      top: 28px;
      width: 2px;
      height: 10px;
      background: var(--sand);
      opacity: .8;
      animation: streamBlink .45s linear infinite;
    }

    .timer-on .sand-top,
    .timer-on .sand-bottom { animation: none; }

    .slider {
      position: absolute;
      right: 32px;
      top: 160px;
      width: 124px;
      height: 12px;
      border-radius: 8px;
      background: #0f0e0d;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.85), 0 1px rgba(255,255,255,.08);
      backface-visibility: hidden;
      transform: translateZ(2px);
    }

    .slider-knob {
      position: absolute;
      top: -5px;
      left: 3px;
      width: 38px;
      height: 22px;
      border-radius: 4px;
      background: linear-gradient(180deg, #d0aa62, #745020);
      border: 1px solid #d7b978;
      box-shadow: 0 4px 8px rgba(0,0,0,.4);
      transition: transform .45s cubic-bezier(.2,.8,.2,1);
    }

    .timer-on .slider-knob { transform: translateX(78px); }

    .engraving {
      position: absolute;
      left: 30px;
      bottom: 14px;
      color: #887153;
      font-family: Georgia, serif;
      font-size: 11px;
      backface-visibility: hidden;
      transform: translateZ(2px);
    }

    .controls {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 124px;
      padding: 18px 24px 24px;
      background: var(--panel);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
    }

    .control-group {
      display: flex;
      gap: 5px;
      padding: 4px;
      border-radius: 6px;
      background: #0d0d0d;
      border: 1px solid #39342f;
    }

    .controls button {
      min-height: 36px;
      padding: 0 15px;
      border: 1px solid #574c3d;
      border-radius: 5px;
      background: #24211e;
      color: #ddd4c7;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }

    .controls button:hover { border-color: #9e7942; }
    .controls button.active,
    .controls button.primary {
      background: #8a622f;
      border-color: #c49a57;
      color: #fff8e9;
    }

    .legend {
      flex-basis: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @keyframes floatPen {
      0%, 100% { transform: translateZ(90px) translateY(0) rotateZ(-10deg); }
      50% { transform: translateZ(90px) translateY(-8px) rotateZ(-9deg); }
    }

    @keyframes spinBody {
      0% { filter: brightness(.96); transform: rotateX(0deg); }
      25% { filter: brightness(1.14); }
      50% { filter: brightness(.83); transform: rotateX(180deg); }
      75% { filter: brightness(1.08); }
      100% { filter: brightness(.96); transform: rotateX(360deg); }
    }

    @keyframes penHighlight {
      0%, 28% { left: -40%; }
      52%, 100% { left: 120%; }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scale(.92); opacity: .42; }
      50% { transform: scale(1.06); opacity: .28; }
    }

    @keyframes idleTop {
      0% { height: 92%; }
      48% { height: 7%; }
      49% { height: 7%; }
      50% { height: 92%; }
      100% { height: 92%; }
    }

    @keyframes idleBottom {
      0% { height: 8%; }
      48% { height: 92%; }
      49% { height: 92%; }
      50% { height: 8%; }
      100% { height: 8%; }
    }

    @keyframes streamBlink {
      0%, 100% { opacity: .35; }
      50% { opacity: .95; }
    }

    @media (max-width: 720px) {
      .topline { top: 18px; left: 18px; right: 18px; }
      .mode-note { display: none; }
      .title h1 { font-size: 20px; }
      .scene { min-height: 550px; padding-top: 92px; }
      .product { transform: scale(.72); }
      .product.guest-view { transform: scale(.72) rotateY(180deg); }
      .controls { min-height: 148px; padding-inline: 12px; }
      .controls button { padding: 0 11px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <header class="topline">
      <div class="title">
        <h1>悬浮时间笔 · 动效概念</h1>
        <p>复古金属桌面物，主人感知剩余时间，客人只看到普通时钟。</p>
      </div>
      <p class="mode-note" id="modeNote">主人侧 · 常态时钟与循环沙漏</p>
    </header>

    <section class="scene" aria-label="产品动效演示">
      <div class="product spin-on" id="product">
        <div class="pen-rig">
          <div class="pen"><span class="clip"></span></div>
          <div class="nib"></div>
        </div>
        <div class="magnetic-shadow"></div>

        <div class="base">
          <div class="face owner-face">
            <div class="screen-content">
              <div class="clock" data-clock>14:36</div>
              <div class="countdown" id="countdown">00:20</div>
              <div class="hourglass" aria-hidden="true">
                <span class="glass-top"><span class="sand-top" id="sandTop"></span></span>
                <span class="sand-stream"></span>
                <span class="glass-bottom"><span class="sand-bottom" id="sandBottom"></span></span>
              </div>
            </div>
          </div>

          <div class="face guest-face">
            <div class="screen-content">
              <div class="clock" data-clock>14:36</div>
            </div>
          </div>

          <div class="slider"><span class="slider-knob"></span></div>
          <span class="engraving">FOR THE TIME YOU GIVE</span>
        </div>
      </div>
    </section>

    <nav class="controls" aria-label="演示控制">
      <div class="control-group">
        <button class="active" id="ownerBtn" type="button">主人侧</button>
        <button id="guestBtn" type="button">客人侧</button>
      </div>
      <button class="primary" id="timerBtn" type="button">启动 20 秒演示</button>
      <button id="resetBtn" type="button">复位</button>
      <button class="active" id="spinBtn" type="button">笔缓慢旋转</button>
      <div class="legend">20 秒仅用于看动效，不代表产品固定时长。客人侧始终保持当前时间。</div>
    </nav>
  </main>

  <script>
    const product = document.getElementById('product');
    const ownerBtn = document.getElementById('ownerBtn');
    const guestBtn = document.getElementById('guestBtn');
    const timerBtn = document.getElementById('timerBtn');
    const resetBtn = document.getElementById('resetBtn');
    const spinBtn = document.getElementById('spinBtn');
    const countdown = document.getElementById('countdown');
    const sandTop = document.getElementById('sandTop');
    const sandBottom = document.getElementById('sandBottom');
    const modeNote = document.getElementById('modeNote');

    const demoSeconds = 20;
    let remaining = demoSeconds;
    let ticker = null;
    let guestView = false;

    function updateClock() {
      const now = new Date();
      const value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.querySelectorAll('[data-clock]').forEach((node) => { node.textContent = value; });
    }

    function updateTimer() {
      countdown.textContent = `00:${String(remaining).padStart(2, '0')}`;
      const ratio = Math.max(0, remaining / demoSeconds);
      sandTop.style.height = `${Math.max(4, ratio * 92)}%`;
      sandBottom.style.height = `${Math.max(8, (1 - ratio) * 92)}%`;
    }

    function setView(isGuest) {
      guestView = isGuest;
      product.classList.toggle('guest-view', isGuest);
      ownerBtn.classList.toggle('active', !isGuest);
      guestBtn.classList.toggle('active', isGuest);
      modeNote.textContent = isGuest
        ? '客人侧 · 始终只是普通时钟'
        : product.classList.contains('timer-on')
          ? '主人侧 · 剩余时间与真实进度沙漏'
          : '主人侧 · 常态时钟与循环沙漏';
    }

    function resetTimer() {
      clearInterval(ticker);
      ticker = null;
      remaining = demoSeconds;
      product.classList.remove('timer-on');
      timerBtn.textContent = '启动 20 秒演示';
      timerBtn.disabled = false;
      sandTop.style.height = '';
      sandBottom.style.height = '';
      setView(guestView);
    }

    function startTimer() {
      resetTimer();
      product.classList.add('timer-on');
      remaining = demoSeconds;
      updateTimer();
      timerBtn.textContent = '倒计时进行中';
      timerBtn.disabled = true;
      setView(false);

      ticker = setInterval(() => {
        remaining -= 1;
        updateTimer();
        if (remaining <= 0) {
          clearInterval(ticker);
          ticker = null;
          timerBtn.textContent = '演示结束';
          modeNote.textContent = '主人侧 · 沙漏落完，无声音提醒';
        }
      }, 1000);
    }

    ownerBtn.addEventListener('click', () => setView(false));
    guestBtn.addEventListener('click', () => setView(true));
    timerBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    spinBtn.addEventListener('click', () => {
      product.classList.toggle('spin-on');
      spinBtn.classList.toggle('active', product.classList.contains('spin-on'));
      spinBtn.textContent = product.classList.contains('spin-on') ? '笔缓慢旋转' : '笔保持静止';
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
